<div class="modal-backdrop" (click)="dismiss()">
  <div
    class="modal"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-body"
    (click)="$event.stopPropagation()"
  >
    <!-- Header with warning icon -->
    <div class="modal-header">
      <div class="modal-warning-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div>
        <div class="modal-title" id="confirm-dialog-title">{{ heading() }}</div>
        <div class="modal-body" id="confirm-dialog-body">
          <ng-content />
        </div>
      </div>
    </div>

    <!-- Error (if any) -->
    <div class="modal-content">
      @if (error(); as message) {
        <div class="alert alert-error" role="alert">{{ message }}</div>
      }
    </div>

    <!-- Actions -->
    <div class="modal-actions">
      <button
        #cancelButton
        type="button"
        class="btn"
        [disabled]="busy()"
        (click)="dismiss()"
      >Cancel</button>
      <button
        type="button"
        class="btn btn-danger"
        [disabled]="busy()"
        (click)="confirmed.emit()"
      >
        @if (busy()) {
          <span class="spinner spinner-small" aria-hidden="true"></span>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
        }
        {{ busy() ? busyLabel() : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
